name: Build, push & deploy orchestrator

on:
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - "terraform/**"
      - ".github/workflows/build-orchestrator.yml"
  workflow_dispatch:

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/eased-orchestrator

jobs:
  # ── 1. Build & push the private orchestrator image to GHCR ──────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Pin the immutable SHA tag so Terraform deploys exactly this build
      - name: Capture image reference
        id: image_ref
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA}" >> "$GITHUB_OUTPUT"

  # ── 2. Deploy via Terraform ──────────────────────────────────────────────────
  terraform:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform

    # All TF_VAR_* env vars are automatically picked up by Terraform as variable values
    env:
      TF_VAR_orchestrator_image:  ${{ needs.build-and-push.outputs.image_ref }}
      TF_VAR_vastai_api_key:      ${{ secrets.TF_VAR_VASTAI_API_KEY }}
      TF_VAR_discord_webhook_url: ${{ secrets.TF_VAR_DISCORD_WEBHOOK_URL }}
      TF_VAR_hf_token:            ${{ secrets.TF_VAR_HF_TOKEN }}
      TF_VAR_authorizer_token:    ${{ secrets.TF_VAR_AUTHORIZER_TOKEN }}
      TF_VAR_ghcr_pat:            ${{ secrets.TF_VAR_GHCR_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
