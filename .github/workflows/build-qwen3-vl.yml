name: Build & push qwen3-vl worker image

on:
  push:
    branches: [main]
    paths:
      - "qwen3-vl/**"
      - ".github/workflows/build-qwen3-vl.yml"
  # Manual trigger — optionally bake an adapter into the image at build time.
  workflow_dispatch:
    inputs:
      base_model:
        description: "HuggingFace model ID to bake in (default: Qwen/Qwen3-VL-8B-Instruct)"
        required: false
        default: "Qwen/Qwen3-VL-8B-Instruct"
      adapter_url:
        description: "HTTPS URL to a .zip LoRA adapter archive (leave blank to skip)"
        required: false
        default: ""
      adapter_name:
        description: "Model ID to expose for the baked-in adapter (e.g. my-ocr-v2)"
        required: false
        default: ""

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qwen3-vl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            # Extra tag when an adapter is baked in so the image is identifiable.
            type=raw,value=${{ inputs.adapter_name }},enable=${{ inputs.adapter_name != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push qwen3-vl image
        uses: docker/build-push-action@v6
        with:
          context: ./qwen3-vl
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_MODEL=${{ inputs.base_model || 'Qwen/Qwen3-VL-8B-Instruct' }}
            ADAPTER_URL=${{ inputs.adapter_url }}
            ADAPTER_NAME=${{ inputs.adapter_name }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
