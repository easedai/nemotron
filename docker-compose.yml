# ── Local development stack ────────────────────────────────────────────────────
#
# Both services build from the same context (eased/) and share app/ code.
#
# Services:
#   redis           Worker queue — round-robin pool + lease tracking
#   orchestrator    Background worker — manages vast.ai GPU workers (no HTTP)
#   load-balancer   HTTP API — /v1/* proxy + /admin/* + /health + /workers
#
# Usage:
#   cp .env.example .env   # fill in VASTAI_API_KEY, DISCORD_WEBHOOK_URL, etc.
#   aws sso login --profile <your-profile>
#   docker compose up --build
#
# Ports:
#   http://localhost:8000   load-balancer (/v1/*, /admin/*, /workers, /health)
#   localhost:6379          Redis (worker queue — not exposed to host by default)
# DynamoDB: uses real AWS (cloud) — ensure AWS_PROFILE is set and SSO session is active.
# ──────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    env_file: .env
    environment:
      LOG_LEVEL: DEBUG
      AWS_DEFAULT_REGION: us-east-1
      ORCHESTRATOR_ID: local
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Hot-reload source: the shared app/ package
      - ./app:/app/app
      # Mount host AWS config so the container can use your SSO session.
      # Run `aws sso login --profile <your-profile>` on the host before starting.
      - ${HOME}/.aws:/root/.aws
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  load-balancer:
    build:
      context: .
      dockerfile: Dockerfile.lb
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LOG_LEVEL: DEBUG
      AWS_DEFAULT_REGION: us-east-1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ${HOME}/.aws:/root/.aws
    command: >
      uvicorn app.lb.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-include "*.py"
        --log-level debug
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
